name: image

# The published image lagged source. ci.yml runs the tests but never built or
# pushed the container, so ghcr.io/devzero-security/redstackpro:latest stayed on
# whatever was last pushed by hand until someone remembered, and a user who
# pulled :latest could get a canvas older than the release. This builds and
# pushes the image on a version tag, so the version tag, :latest, and the source
# at that tag agree. Timing stays manual: the image moves when a release tag is
# cut, not on every push to main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A v0.10.0 tag becomes the image tags 0.10.0 and latest; metadata-action
      # strips the leading v for the semver tag.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/devzero-security/redstackpro
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
