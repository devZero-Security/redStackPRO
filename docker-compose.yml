# Run the canvas locally.
#   docker compose up                      SQLite, http://127.0.0.1:8000
#   docker compose --profile postgres up   Postgres (set REDSTACKPRO_DATABASE_URL to the db URL)
#   REDSTACKPRO_PORT=8787 docker compose up  serve on a different host port (default 8000)
# The app does not wait for Postgres: if it starts first it exits, and
# restart: unless-stopped starts it again until the database is up.

name: redstackpro

services:
  redstackpro:
    build: .
    image: ghcr.io/devzero-security/redstackpro:0.10.0
    ports:
      - "${REDSTACKPRO_PORT:-8000}:8000"
    volumes:
      - redstackpro-data:/data
    environment:
      REDSTACKPRO_DATABASE_URL: ${REDSTACKPRO_DATABASE_URL:-sqlite+pysqlite:////data/redstackpro.db}
    restart: unless-stopped

  db:
    image: postgres:16
    profiles:
      - postgres
    environment:
      POSTGRES_DB: redstackpro
      POSTGRES_USER: redstackpro
      POSTGRES_PASSWORD: redstackpro
    volumes:
      - redstackpro-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redstackpro-data:
  redstackpro-pg:
