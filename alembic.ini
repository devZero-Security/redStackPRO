# Alembic configuration.
#
# The schema is owned by migrations for a real database. Local and test runs use
# SQLite and build the schema straight from the models, because there is nothing
# to stand up; the app only reaches for migrations on a non-SQLite backend. A
# test asserts the two cannot drift. See 0023.
#
# The database URL is not set here. env.py reads REDSTACKPRO_DATABASE_URL, the same
# variable make_engine reads, so alembic and the app never point at different
# databases.
[alembic]
script_location = src/redstackpro/api/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Percent signs are doubled: configparser (strict on Python 3.14) reads a bare %
# as an interpolation token. Doubling is the configparser escape, restored to a
# single % by any consumer that reads through interpolation.
[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
