---
# directory: create one or more directories on the host (a staging folder, a
# drop point, a marker a lab or CTF references). Paths come from
# vulns_vars.directory (a list); a default is used if none. Distinct from the
# share vulns (openshares / writable_share) which publish SMB shares -- this only
# makes the folder. Mirrors GOAD's directory.

- name: Create the declared directories
  ansible.windows.win_file:
    path: "{{ dir_path }}"
    state: directory
  loop: "{{ redstackpro_host_vulns_vars.directory | default(['C:\\redstackpro\\staging']) }}"
  loop_control:
    loop_var: dir_path
