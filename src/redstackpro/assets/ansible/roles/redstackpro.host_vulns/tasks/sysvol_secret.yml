---
# SYSVOL script secret: a logon/administrative script left in SYSVOL with a
# hardcoded credential, readable by any authenticated user (SYSVOL is world-
# readable in the domain). GOAD drops a "script.ps1" and a "secret.ps1" under
# SYSVOL\domain\scripts on the north DC. This runs on a controller (it writes the
# local SYSVOL copy, which replicates). The embedded secret is the shared lab
# password.

- name: Ensure the SYSVOL scripts directory exists
  ansible.windows.win_file:
    path: C:\Windows\SYSVOL\domain\scripts
    state: directory

- name: Drop a SYSVOL script carrying a hardcoded credential
  ansible.windows.win_copy:
    dest: C:\Windows\SYSVOL\domain\scripts\{{ (redstackpro_host_vulns_vars.sysvol_secret | default({})).name | default('secret.ps1') }}
    content: |
      # Automated maintenance helper. Do not edit.
      $user = "{{ (redstackpro_host_vulns_vars.sysvol_secret | default({})).account | default('svc-backup') }}"
      $pass = "{{ (redstackpro_user_passwords | default({})).get((redstackpro_host_vulns_vars.sysvol_secret | default({})).account | default('svc-backup'), redstackpro_lab_password) }}"
      $sec = ConvertTo-SecureString $pass -AsPlainText -Force
      $cred = New-Object System.Management.Automation.PSCredential($user, $sec)
      # ... uses $cred to map a maintenance share ...
