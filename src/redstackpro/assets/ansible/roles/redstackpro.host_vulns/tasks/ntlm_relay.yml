---
# NTLM-relay posture: a recurring privileged "victim" scheduled task that
# authenticates over SMB to another host, generating coercible NTLM auth an
# attacker can relay (e.g. to LDAP or the AD CS web endpoint). Runs as a
# privileged domain user (GOAD uses eddard.stark) with the shared lab password.

- name: Create the NTLM-relay coercion bot
  ansible.windows.win_powershell:
    script: |
      param($User, $Pass, $Target)
      $ErrorActionPreference = "Stop"
      $cmd = "New-PSDrive -Name Public -PSProvider FileSystem -Root $Target -ErrorAction SilentlyContinue"
      $a = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-WindowStyle Hidden -Command `"$cmd`""
      $t = New-ScheduledTaskTrigger -Once -At (Get-Date) -RepetitionInterval (New-TimeSpan -Minutes 5)
      Register-ScheduledTask -TaskName ntlm_bot -Action $a -Trigger $t `
        -User $User -Password $Pass -RunLevel Highest -Force | Out-Null
    parameters:
      User: "{{ redstackpro_host_vulns_vars.ntlm_relay_user | default(redstackpro_host_vulns_vars.bot_user | default('')) }}"
      Pass: "{{ (redstackpro_user_passwords | default({})).get(redstackpro_host_vulns_vars.ntlm_relay_user | default(redstackpro_host_vulns_vars.bot_user | default('')), redstackpro_lab_password) }}"
      Target: "{{ redstackpro_host_vulns_vars.ntlm_relay_target | default('\\\\Meren\\Private') }}"
  changed_when: true
  when: (redstackpro_host_vulns_vars.ntlm_relay_user | default(redstackpro_host_vulns_vars.bot_user | default(''))) | length > 0
