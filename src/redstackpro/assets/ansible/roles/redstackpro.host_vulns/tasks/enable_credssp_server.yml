---
# CredSSP server: let this host accept CredSSP authentication -- the receiving end
# of an unconstrained double-hop, so a relayed/forwarded credential can be used
# here. Adds CredSSP to the WSMan service's allowed auth.

- name: Enable CredSSP server authentication
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = "Stop"
      Enable-WSManCredSSP -Role Server -Force | Out-Null
      [Ordered]@{ credssp_server = (Get-Item WSMan:\localhost\Service\Auth\CredSSP).Value }
  changed_when: true
