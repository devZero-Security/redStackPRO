---
# Writable share / loose permissions: a directory whose ACL lets a low-privileged
# identity write where it should not. In GOAD this is the IIS worker identity
# (IIS_IUSRS) with FullControl over the web root's upload folder, turning an upload
# form into a web shell. Parameters come from the host's vulns_vars.permissions
# (path/user/rights), defaulting to that IIS case. See goad-fidelity-build.
# The path scalars are SINGLE-quoted so the YAML loader leaves the backslashes
# alone: double-quoted, the default collapsed to 'C:\inetpub\wwwroot\upload' and
# Jinja died on the \u as a truncated \uXXXX escape. See files.yml for the fuller
# note on this trap.

- name: Ensure the target directory exists
  ansible.windows.win_file:
    path: '{{ (redstackpro_host_vulns_vars.permissions | default({})).path | default("C:\\inetpub\\wwwroot\\upload") }}'
    state: directory

- name: Grant the loose permission
  ansible.windows.win_acl:
    path: '{{ (redstackpro_host_vulns_vars.permissions | default({})).path | default("C:\\inetpub\\wwwroot\\upload") }}'
    user: "{{ (redstackpro_host_vulns_vars.permissions | default({})).user | default('IIS_IUSRS') }}"
    rights: "{{ (redstackpro_host_vulns_vars.permissions | default({})).rights | default('FullControl') }}"
    type: allow
    inherit: ContainerInherit, ObjectInherit
    state: present
