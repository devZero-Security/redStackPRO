---
# Stored credential (Credential Manager): a cleartext credential saved in a user's
# vault (GOAD stores a TERMSRV/castelblack domain-password cred in robb.stark's
# vault). cmdkey writes into the *current* user's vault, so this runs under a
# scheduled task logged on as that user. The range shares one lab password, so the
# vault owner logs on with it and the stored secret is that same lab password.
# Parameters come from vulns_vars.stored_credential. See goad-fidelity-build.

- name: Plant a Credential Manager credential in a user's vault
  ansible.windows.win_powershell:
    script: |
      param($Owner, $Pass, $Target, $CredUser, $CredPass)
      $ErrorActionPreference = "Stop"
      $inner = "cmdkey /add:$Target /user:$CredUser /pass:$CredPass" +
               " ; echo done > C:\Windows\Temp\rsp-cred-done.txt"
      Set-Content C:\Windows\Temp\rsp-cred.ps1 $inner
      Remove-Item C:\Windows\Temp\rsp-cred-done.txt -ErrorAction SilentlyContinue
      $arg = "-ExecutionPolicy Bypass -File C:\Windows\Temp\rsp-cred.ps1"
      $a = New-ScheduledTaskAction -Execute "powershell.exe" -Argument $arg
      Register-ScheduledTask -TaskName RSPStoredCred -Action $a -User $Owner `
        -Password $Pass -RunLevel Highest -Force | Out-Null
      Start-ScheduledTask -TaskName RSPStoredCred
      for ($i = 0; $i -lt 20; $i++) {
        Start-Sleep -Seconds 3
        if (Test-Path C:\Windows\Temp\rsp-cred-done.txt) { break }
      }
      Unregister-ScheduledTask -TaskName RSPStoredCred -Confirm:$false -ErrorAction SilentlyContinue
      [Ordered]@{ owner = $Owner; target = $Target }
    parameters:
      Owner: "{{ (redstackpro_host_vulns_vars.stored_credential | default({})).owner | default('') }}"
      Pass: "{{ (redstackpro_user_passwords | default({})).get((redstackpro_host_vulns_vars.stored_credential | default({})).owner | default(''), redstackpro_lab_password) }}"
      Target: "{{ (redstackpro_host_vulns_vars.stored_credential | default({})).target | default('TERMSRV/castelblack') }}"
      CredUser: "{{ (redstackpro_host_vulns_vars.stored_credential | default({})).username | default('') }}"
      CredPass: "{{ (redstackpro_user_passwords | default({})).get((redstackpro_host_vulns_vars.stored_credential | default({})).username | default(''), redstackpro_lab_password) }}"
  changed_when: true
  when: (redstackpro_host_vulns_vars.stored_credential | default({})).owner | default('') | length > 0
