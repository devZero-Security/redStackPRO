---
# LDAP signing / channel binding not enforced on the domain controller. Modern
# Windows trends toward requiring LDAP signing (LDAPServerIntegrity=2) and channel
# binding, which refuses an unsigned SMB->LDAP relay ("client requested signing" in
# the solution's Part 4). Setting the DC back to not-required restores the
# posture GOAD relies on, so coerced NTLM can be relayed to LDAP for RBCD / ESC8.
# This is a config toggle (a security-descriptor/registry setting), not a patch
# dependency. Only meaningful on a DC, so it is guarded on the NTDS service; on a
# non-DC it is a harmless no-op. Reversing a hardening default -- deliberately a
# vuln toggle, secure by default.

- name: Check whether this host is a domain controller (NTDS present)
  ansible.windows.win_service_info:
    name: NTDS
  register: redstackpro_ldapsign_ntds
  failed_when: false

- name: Stop the DC enforcing LDAP signing and channel binding
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
    name: "{{ ldap_reg.name }}"
    data: "{{ ldap_reg.data }}"
    type: dword
  loop:
    # 1 = signing negotiated but not required (2 would require it).
    - { name: LDAPServerIntegrity, data: 1 }
    # 0 = channel binding never enforced (1 = when supported, 2 = always).
    - { name: LdapEnforceChannelBinding, data: 0 }
  loop_control:
    # A distinct loop_var: this file is included from host_vulns' own `item` loop.
    loop_var: ldap_reg
    label: "{{ ldap_reg.name }}={{ ldap_reg.data }}"
  when: (redstackpro_ldapsign_ntds.exists | default(false))
