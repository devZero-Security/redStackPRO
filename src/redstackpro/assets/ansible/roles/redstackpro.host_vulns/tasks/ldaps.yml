---
# ldaps: give the domain controller a certificate and let it serve LDAP over TLS
# (636). This is realism / defensive posture, not a weakness: labs like GOAD
# dracarys ship a real LDAPS endpoint so LDAP tooling must speak LDAPS and the
# enumeration path reflects a hardened DC. A DC automatically enables LDAPS once a
# suitable Server-Authentication certificate for its own FQDN is in the machine
# store, so this creates a self-signed one and lets the directory pick it up.
# See goad-fidelity-build and dracarys-fidelity-gap.

- name: Ensure an LDAPS server-authentication certificate is present
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $fqdn = "$env:COMPUTERNAME." + (Get-CimInstance Win32_ComputerSystem).Domain
      $have = Get-ChildItem Cert:\LocalMachine\My -ErrorAction SilentlyContinue |
        Where-Object { $_.Subject -eq "CN=$fqdn" -and $_.EnhancedKeyUsageList.FriendlyName -contains 'Server Authentication' }
      if (-not $have) {
        New-SelfSignedCertificate -Subject "CN=$fqdn" -DnsName $fqdn `
          -CertStoreLocation Cert:\LocalMachine\My `
          -KeyExportPolicy Exportable -KeySpec KeyExchange `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.1") | Out-Null
      }
      # A DC binds LDAPS automatically once a Server-Authentication cert for its
      # own FQDN is in the machine store; it is picked up on the next certificate
      # reload (periodic, or a reboot), so no explicit rebind is needed here.
      [Ordered]@{ ldaps_fqdn = $fqdn; cert_present = $true }
  changed_when: true
