---
# A GOAD-faithful lab needs weak per-user passwords ("hodor", "Needle",
# "iknownothing") or its documented spray / AS-REP / Kerberoast / description
# paths do not resolve. The directory refuses them under the default policy, so
# the policy has to be relaxed BEFORE the users are created.
#
# Setting it with Set-ADDefaultDomainPasswordPolicy alone is not enough, and this
# was found live on AWS: the cmdlet writes the domain object's attributes, but the
# Default Domain Policy GPO defines the same settings and re-asserts them on the
# next Group Policy refresh. The relax therefore reverts, and because the old task
# hardcoded changed_when: true it reported success while doing nothing durable.
# What followed was worse than a visible failure: microsoft.ad.user still created
# each account but could not set its password, leaving seven users per domain as
# DISABLED, password-less shells -- including hodor, the assumed-breach foothold
# the whole solution starts from. The range looked converged and had no way in.
#
# So the settings are written into the Default Domain Policy GPO itself, which is
# the store Group Policy refreshes FROM, and then verified.

# The domain object is set first so the relax is effective immediately, without
# waiting on a Group Policy cycle. The GPO edit below is what makes it survive one.
- name: Relax the domain password policy on the domain object
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory
      Set-ADDefaultDomainPasswordPolicy -Server localhost `
        -Identity '{{ redstackpro_domain.domain_fqdn }}' `
        -ComplexityEnabled $false -MinPasswordLength 1 `
        -MinPasswordAge ([TimeSpan]::Zero) -PasswordHistoryCount 0
  register: redstackpro_pwpolicy_obj
  until: redstackpro_pwpolicy_obj is succeeded
  retries: 10
  delay: 15

- name: Write the relaxed policy into the Default Domain Policy GPO
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = "Stop"
      Import-Module ActiveDirectory
      # The Default Domain Policy's GUID is well known and identical in every
      # forest, so it needs no lookup.
      $guid = "{31B2F340-016D-11D2-945F-00C04FB984F9}"
      # -Server localhost throughout, as everywhere else in this role. A bare
      # Get-ADDomain does default-server DISCOVERY, which still fails right after a
      # promotion reboot even once ADWS answers the role's wait task: it dies on
      # "Error initializing default drive ... Unable to find a default server with
      # Active Directory Web Services running". That failed all three DCs on a
      # clean AWS run and cost the single-pass gate.
      $dom = Get-ADDomain -Server localhost
      # Reach SYSVOL by its LOCAL path, not \\<domain>\SYSVOL. The UNC form resolves
      # through the DFS namespace, which is not up yet on a freshly promoted DC: on a
      # clean AWS run this threw "GptTmpl.inf not found" ten times and failed the
      # play, and only succeeded on later attempts once DFS had settled. The local
      # path is valid the moment the controller is. Netlogon's own SysVol value is
      # the authoritative location, falling back to the default layout.
      $sysvol = (Get-ItemProperty `
        "HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters" `
        -Name SysVol -ErrorAction SilentlyContinue).SysVol
      if (-not $sysvol) { $sysvol = Join-Path $env:SystemRoot "SYSVOL\sysvol" }
      $policies = Join-Path (Join-Path $sysvol $dom.DNSRoot) "Policies\$guid"
      $inf = Join-Path $policies "MACHINE\Microsoft\Windows NT\SecEdit\GptTmpl.inf"
      $gpt = Join-Path $policies "gpt.ini"

      $settings = [ordered]@{
        MinimumPasswordAge    = 0
        MaximumPasswordAge    = -1
        MinimumPasswordLength = 1
        PasswordComplexity    = 0
        PasswordHistorySize   = 0
      }

      # GptTmpl.inf is UTF-16. Read and write it as such or the file is corrupted
      # and Group Policy silently stops applying the whole GPO.
      # A brand new domain can have the GPO without the SecEdit subtree yet, since
      # nothing has edited its security settings. That is a file to create, not a
      # reason to fail: write the minimal skeleton the section needs and let the
      # merge below fill in the values.
      if (-not (Test-Path $inf)) {
        New-Item -ItemType Directory -Force -Path (Split-Path $inf -Parent) | Out-Null
        [System.IO.File]::WriteAllLines($inf, @(
          "[Unicode]", "Unicode=yes", "[Version]",
          'signature="$CHICAGO$"', "Revision=1", "[System Access]"
        ), [System.Text.Encoding]::Unicode)
      }
      $lines = [System.IO.File]::ReadAllLines($inf, [System.Text.Encoding]::Unicode)

      $out = New-Object System.Collections.Generic.List[string]
      $inSystemAccess = $false
      $seen = @{}
      foreach ($line in $lines) {
        if ($line -match '^\s*\[') {
          # Leaving [System Access]: emit any key the file did not already carry.
          if ($inSystemAccess) {
            foreach ($k in $settings.Keys) {
              if (-not $seen[$k]) { $out.Add("$k = " + $settings[$k]) }
            }
          }
          $inSystemAccess = ($line -match '^\s*\[System Access\]')
          $out.Add($line)
          continue
        }
        if ($inSystemAccess -and $line -match '^\s*([A-Za-z]+)\s*=') {
          $key = $Matches[1]
          if ($settings.Contains($key)) {
            $out.Add("$key = " + $settings[$key])
            $seen[$key] = $true
            continue
          }
        }
        $out.Add($line)
      }
      # The section can also be the last one in the file.
      if ($inSystemAccess) {
        foreach ($k in $settings.Keys) {
          if (-not $seen[$k]) { $out.Add("$k = " + $settings[$k]) }
        }
      }
      [System.IO.File]::WriteAllLines($inf, $out, [System.Text.Encoding]::Unicode)

      # Group Policy only re-reads a GPO whose version changed, and it compares the
      # copy in SYSVOL against the versionNumber on the AD object. The computer half
      # lives in the high word, so a machine-policy change advances it by 65536 and
      # both records have to agree or the GPO is treated as damaged.
      $ad = Get-ADObject -Server localhost `
              -Identity ("CN=" + $guid + ",CN=Policies,CN=System," + $dom.DistinguishedName) `
              -Properties versionNumber
      $next = [int]$ad.versionNumber + 65536
      Set-ADObject -Server localhost -Identity $ad.DistinguishedName `
        -Replace @{versionNumber = $next}
      # gpt.ini can be absent on a new domain for the same reason as GptTmpl.inf.
      if (Test-Path $gpt) {
        (Get-Content $gpt) -replace '^Version=.*', ("Version=" + $next) |
          Set-Content $gpt -Encoding ASCII
      } else {
        Set-Content $gpt -Encoding ASCII -Value @("[General]", "Version=" + $next)
      }

      gpupdate /force /target:computer | Out-Null
      Write-Output ("versionNumber=" + $next)
  register: redstackpro_pwpolicy_gpo
  changed_when: true
  # Writing the GPO is a precondition for the users, so a transient directory blip
  # must not take the whole site.yml attempt down with it. Rewriting the same values
  # is harmless, and the version bump only advances the counter.
  until: redstackpro_pwpolicy_gpo is succeeded
  retries: 10
  delay: 15

# The relax is a precondition for the users, not a nicety, so it is proven rather
# than assumed. The old task's hardcoded changed_when hid exactly this failure, and
# a range that comes up without its foothold account is worse than a failed deploy.
- name: Verify the relaxed password policy is actually in effect
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory
      $p = Get-ADDefaultDomainPasswordPolicy -Server localhost `
             -Identity '{{ redstackpro_domain.domain_fqdn }}'
      if ($p.ComplexityEnabled -or $p.MinPasswordLength -gt 1) {
        throw ("password policy still enforced: ComplexityEnabled=" +
               $p.ComplexityEnabled + " MinPasswordLength=" + $p.MinPasswordLength +
               ". The lab's weak per-user passwords would be refused and their " +
               "accounts left disabled without a password.")
      }
      Write-Output "relaxed"
  register: redstackpro_pwpolicy_ok
  until: redstackpro_pwpolicy_ok is succeeded
  retries: 6
  delay: 10
  changed_when: false
