---
# Splunk receives over HEC. The receiver posts to it rather than writing an
# index directly, which keeps the beats port the only thing the shippers know
# about and leaves the sink swappable.
#
# Splunk is licensed software and is not redistributed here. The role installs
# from the vendor with credentials the operator supplies, and does nothing if
# they have not.

- name: Fail early if no Splunk package was supplied
  ansible.builtin.assert:
    that: redstackpro_splunk_deb_url | default('') | length > 0
    fail_msg: >
      The collector sink is splunk and redstackpro_splunk_deb_url is unset. Splunk
      is not redistributable, so redStackPRO cannot fetch it for you. Set the
      variable to your download URL, or change the sink in the topology.

- name: Fetch the Splunk package
  ansible.builtin.get_url:
    url: "{{ redstackpro_splunk_deb_url }}"
    dest: /tmp/splunk.deb
    mode: "0600"

- name: Install Splunk
  ansible.builtin.apt:
    deb: /tmp/splunk.deb
    state: present

- name: Accept the licence and start once
  ansible.builtin.command:
    cmd: /opt/splunk/bin/splunk start --accept-license --answer-yes --no-prompt
    creates: /opt/splunk/etc/splunk-launch.conf

- name: Create the index the receiver writes to
  ansible.builtin.command:
    cmd: /opt/splunk/bin/splunk add index {{ redstackpro_splunk_index }} -auth admin:changeme
    creates: "/opt/splunk/var/lib/splunk/{{ redstackpro_splunk_index }}"
  failed_when: false

# The token is generated by Splunk on this host. redStackPRO never sees it and it is
# not in the export, which is the same rule the CA key and the portal password
# follow. See 0001.
- name: Say where the HEC token comes from
  ansible.builtin.debug:
    msg: >-
      Enable a HEC token on port {{ redstackpro_splunk_hec_port }} for index
      {{ redstackpro_splunk_index }}, then put it in REDSTACKPRO_HEC_TOKEN in
      /etc/default/logstash. The receiver reads it from the environment so it
      never lands in a generated file.
