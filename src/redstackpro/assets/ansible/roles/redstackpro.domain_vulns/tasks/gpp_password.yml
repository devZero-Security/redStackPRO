---
# Plant a Group Policy Preferences cpassword in SYSVOL. GPP encrypts the password
# with a key Microsoft published, so anyone who reads the Groups.xml decrypts it.
# Runs on the controller (SYSVOL lives here). Gated by a member declaring
# gpp_password, so removing that vuln on the canvas removes the finding.
- name: Plant a decryptable GPP cpassword in SYSVOL
  ansible.windows.win_powershell:
    script: |
      param($Password, $DomainFqdn)
      $ErrorActionPreference = "Stop"
      # The published GPP AES-256 key: the cpassword is reversible by design.
      $key = [byte[]]@(0x4e,0x99,0x06,0xe8,0xfc,0xb6,0x6c,0xc9,0xfa,0xf4,0x93,0x10,
                       0x62,0x0f,0xfe,0xe8,0xf4,0x96,0xe8,0x06,0xcc,0x05,0x79,0x90,
                       0x20,0x9b,0x09,0xa4,0x33,0xb6,0x6c,0x1b)
      $aes = [System.Security.Cryptography.Aes]::Create()
      $aes.Key = $key
      $aes.IV = New-Object byte[] 16
      $aes.Mode = [System.Security.Cryptography.CipherMode]::CBC
      $aes.Padding = [System.Security.Cryptography.PaddingMode]::PKCS7
      $pt = [System.Text.Encoding]::Unicode.GetBytes($Password)
      $ct = $aes.CreateEncryptor().TransformFinalBlock($pt, 0, $pt.Length)
      $cpassword = [Convert]::ToBase64String($ct)
      $gpo = "{31B2F340-016D-11D2-945F-00C04FB984F9}"
      $dir = "C:\Windows\SYSVOL\sysvol\$DomainFqdn\Policies\$gpo\Machine\Preferences\Groups"
      New-Item -ItemType Directory -Path $dir -Force | Out-Null
      $uid = [guid]::NewGuid().ToString("B")
      $xml = '<?xml version="1.0" encoding="utf-8"?>' +
        '<Groups clsid="{3125E937-EB16-4b4c-9934-544FC6D24D26}">' +
        '<User clsid="{DF5F1855-51E5-4d24-8B1A-D9BDE98BA1D1}" name="rspadmin" image="2" changed="2024-01-01 00:00:00" uid="' + $uid + '">' +
        '<Properties action="U" newName="" fullName="redStackPro planted admin" description="" ' +
        'cpassword="' + $cpassword + '" changeLogon="0" noChange="1" neverExpires="1" acctDisabled="0" userName="rspadmin"/>' +
        '</User></Groups>'
      Set-Content -Path "$dir\Groups.xml" -Value $xml -Encoding UTF8
      [Ordered]@{ path = "$dir\Groups.xml"; cpassword = $cpassword }
    parameters:
      Password: "{{ redstackpro_lab_password }}"
      DomainFqdn: "{{ redstackpro_domain.domain_fqdn }}"
  changed_when: true
