---
# The OpenVPN access mode, the alternative to wireguard chosen in the overlay.
# The server stands up either way; when the topology declared operators, each one
# gets a client certificate issued by the jumpbox CA and a client .ovpn rendered
# for the admin to hand out. Keys are generated here and never leave the jumpbox;
# only the .ovpn is fetched and distributed. See vpn-multiuser-spec and 0001.
#
# The server certificate is issued by the jumpbox CA, so a topology that turns the
# certificate authority off and asks for openvpn is a topology that has to supply
# its own material.

- name: Fail early if openvpn was asked for without a certificate authority
  ansible.builtin.assert:
    that: redstackpro_jumpbox_certificate_authority | bool
    fail_msg: >
      openvpn needs a certificate authority to issue the server certificate,
      and certificate_authority is false in the overlay. Turn it on, or supply
      /etc/openvpn/server before running this play.

- name: Install openvpn
  ansible.builtin.apt:
    name:
      - openvpn
      - easy-rsa
    state: present

- name: Create the openvpn directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /etc/openvpn/server
    - /etc/openvpn/server/pki
    - /etc/openvpn/server/clients

- name: Generate the server key
  ansible.builtin.command:
    cmd: openssl genrsa -out /etc/openvpn/server/pki/server.key 2048
    creates: /etc/openvpn/server/pki/server.key

- name: Request a server certificate
  ansible.builtin.command:
    cmd: >
      openssl req -new
      -key /etc/openvpn/server/pki/server.key
      -subj "/CN={{ inventory_hostname }}"
      -out /etc/openvpn/server/pki/server.csr
    creates: /etc/openvpn/server/pki/server.csr

- name: Sign it with the jumpbox certificate authority
  ansible.builtin.command:
    cmd: >
      openssl x509 -req
      -in /etc/openvpn/server/pki/server.csr
      -CA {{ redstackpro_ca_dir }}/ca.crt
      -CAkey {{ redstackpro_ca_dir }}/ca.key
      -CAserial {{ redstackpro_ca_dir }}/ca.srl
      -days {{ redstackpro_ca_days }} -sha256
      -out /etc/openvpn/server/pki/server.crt
    creates: /etc/openvpn/server/pki/server.crt

- name: Generate Diffie Hellman parameters
  ansible.builtin.command:
    cmd: openssl dhparam -out /etc/openvpn/server/pki/dh.pem 2048
    creates: /etc/openvpn/server/pki/dh.pem

- name: Write the server configuration
  ansible.builtin.template:
    src: openvpn-server.conf.j2
    dest: /etc/openvpn/server/redstackpro.conf
    mode: "0600"
  notify: Restart openvpn

- name: Start openvpn
  ansible.builtin.service:
    name: "openvpn-server@redstackpro"
    state: started
    enabled: true

# -- per-operator client certificates and configs

# The durable roster (seeds operators.json, loads redstackpro_effective_operators,
# installs rsp-operator, creates the client output dir). An OpenVPN client survives
# a reconverge on its own (any CA-signed cert connects), so here the roster mainly
# keeps operators.json and rsp-operator in step with the wireguard mode. See
# vpn-roster.yml.
- name: Establish the durable operator roster
  ansible.builtin.include_tasks: vpn-roster.yml

- name: Generate a client key for each operator
  ansible.builtin.command:
    cmd: openssl genrsa -out /etc/openvpn/server/clients/{{ item.handle }}.key 2048
    creates: /etc/openvpn/server/clients/{{ item.handle }}.key
  loop: "{{ redstackpro_effective_operators | default([]) }}"
  loop_control:
    label: "{{ item.handle }}"

- name: Request a client certificate for each operator
  ansible.builtin.command:
    cmd: >
      openssl req -new
      -key /etc/openvpn/server/clients/{{ item.handle }}.key
      -subj "/CN={{ item.handle }}"
      -out /etc/openvpn/server/clients/{{ item.handle }}.csr
    creates: /etc/openvpn/server/clients/{{ item.handle }}.csr
  loop: "{{ redstackpro_effective_operators | default([]) }}"
  loop_control:
    label: "{{ item.handle }}"

- name: Sign each client certificate with the jumpbox CA
  ansible.builtin.command:
    cmd: >
      openssl x509 -req
      -in /etc/openvpn/server/clients/{{ item.handle }}.csr
      -CA {{ redstackpro_ca_dir }}/ca.crt
      -CAkey {{ redstackpro_ca_dir }}/ca.key
      -CAserial {{ redstackpro_ca_dir }}/ca.srl
      -days {{ redstackpro_ca_days }} -sha256
      -out /etc/openvpn/server/clients/{{ item.handle }}.crt
    creates: /etc/openvpn/server/clients/{{ item.handle }}.crt
  loop: "{{ redstackpro_effective_operators | default([]) }}"
  loop_control:
    label: "{{ item.handle }}"

- name: Read the CA certificate
  ansible.builtin.slurp:
    src: "{{ redstackpro_ca_dir }}/ca.crt"
  register: redstackpro_ovpn_ca
  when: (redstackpro_effective_operators | default([])) | length > 0

- name: Read each operator certificate
  ansible.builtin.slurp:
    src: /etc/openvpn/server/clients/{{ item.handle }}.crt
  loop: "{{ redstackpro_effective_operators | default([]) }}"
  loop_control:
    label: "{{ item.handle }}"
  register: redstackpro_ovpn_client_certs

- name: Read each operator key
  ansible.builtin.slurp:
    src: /etc/openvpn/server/clients/{{ item.handle }}.key
  loop: "{{ redstackpro_effective_operators | default([]) }}"
  loop_control:
    label: "{{ item.handle }}"
  register: redstackpro_ovpn_client_keys

- name: Assemble the per-operator client facts
  ansible.builtin.set_fact:
    redstackpro_ovpn_clients: >-
      {{ (redstackpro_ovpn_clients | default([])) + [{
        'handle': item.item.handle,
        'certificate': (item.content | b64decode | trim),
        'private_key': (redstackpro_ovpn_client_keys.results[idx].content | b64decode | trim)}] }}
  loop: "{{ redstackpro_ovpn_client_certs.results | default([]) }}"
  loop_control:
    index_var: idx
    label: "{{ item.item.handle }}"

- name: Render each operator client config
  ansible.builtin.template:
    src: client-ovpn.j2
    dest: "{{ redstackpro_vpn_client_dir }}/{{ item.handle }}.ovpn"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  loop: "{{ redstackpro_ovpn_clients | default([]) }}"
  loop_control:
    label: "{{ item.handle }}"

- name: Say where the client configs are
  ansible.builtin.debug:
    msg: >-
      OpenVPN is up on {{ redstackpro_openvpn_protocol }}/{{ redstackpro_openvpn_port }}
      with {{ redstackpro_ovpn_clients | default([]) | length }} operator config(s) in
      {{ redstackpro_vpn_client_dir }}; hand each operator their own .ovpn.
