---
# Assumed-breach foothold accounts. Each name here is a domain user the
# canvas flagged assumed_breach; on the jumpbox it is also created as a LOCAL
# admin (sudo) so an operator can SSH in as patient zero. The domain side (the
# same name as a low-priv member) is seeded by the dc role, so the one identity
# is a jumpbox admin and a low-priv domain user at once. The password is the
# shared lab password the boot script wrote to /etc/redstackpro/lab-password.

- name: Create each assumed-breach foothold account (local admin)
  ansible.builtin.user:
    name: "{{ foothold_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    state: present
  loop: "{{ redstackpro_jumpbox_foothold_users }}"
  loop_control:
    loop_var: foothold_user

# chpasswd reads the password from the file at shell time rather than through the
# template, so a lab password with shell-special characters is never interpolated
# into the command. The username is a plain identifier, safe to interpolate.
- name: Set the foothold accounts to the shared lab password
  ansible.builtin.shell: >
    printf '%s:%s\n' "{{ foothold_user }}" "$(cat /etc/redstackpro/lab-password)"
    | chpasswd
  loop: "{{ redstackpro_jumpbox_foothold_users }}"
  loop_control:
    loop_var: foothold_user
  no_log: true
  changed_when: true
