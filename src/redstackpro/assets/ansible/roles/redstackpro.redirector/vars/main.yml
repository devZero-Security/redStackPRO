# The landing-page sections, keyed by the same decoy id as the catalog above.
#
# Kept as a second mapping rather than folded into each site so the catalog
# stays readable as a catalog: palette and pages in one place, marketing copy
# in another. The role passes both to the template.
#
# Shape per theme: phone, address lines, hours, three services, three
# testimonials, a mission block, three statistics, and a closing call to
# action. Everything is invented. No entry names a real organisation, person,
# brand, address or telephone number, and the streets are made up.
#
# NO NUMBER HERE CAN RING ANYONE, and the area code matches the city in the
# address above it -- a local number reads as a business somebody could walk
# into, which a toll-free line does not.
#
#   US: the city's real area code, then an exchange ENDING IN 11 (211, 311,
#       611, 711, 811). Those are service codes in the North American plan and
#       are never assigned as a central office code, so the number is
#       structurally unreachable while reading as an ordinary one. This is done
#       instead of the 555-01XX fiction block, which is the conventional choice
#       but announces itself to anyone who has watched a film.
#   UK: Ofcom's drama ranges, which are per-city and guaranteed unallocated:
#       0113/0114/0117/0118/0151 496 0XXX for Leeds, Sheffield, Bristol,
#       Reading and Liverpool.
#
# This is why the travel site is in Liverpool rather than Brighton: Brighton
# has no reserved range, and an invented 01273 number is somebody's real line.
# Inventing a toll-free number is the same trap and worse, because toll-free
# means the subscriber pays for every call a visitor makes.
#
# Why this much: a cover page that is a heading and two paragraphs reads as a
# placeholder, and a placeholder is exactly what a visitor should not conclude.
# A small business site has services, a quote or two, an address and a way to
# call it. See 0041.

