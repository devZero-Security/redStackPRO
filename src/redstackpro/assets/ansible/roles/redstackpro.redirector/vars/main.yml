# The decoy site catalog. Each entry is a believable but entirely fictional
# small site the redirector serves to any request that misses the gate: a home
# page, a couple of navigable subpages, and a 404. No entry names a real
# organisation, brand, or domain. The gating.decoy value picks the entry; the
# redstackpro.decoy-site template renders every page from it. Adding a vertical is a
# block here plus a line in the schema enum. See 0041.
#
# Shape per theme: brand, tagline, a colour palette (bg, card, accent, text,
# muted), a pages list whose first entry becomes index.html, and a notfound page
# for the 404. Each page body is a list of paragraphs.

