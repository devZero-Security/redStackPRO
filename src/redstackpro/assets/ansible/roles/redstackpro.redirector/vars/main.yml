# What each vertical's photographs are of.
#
# These are search terms, not filenames. The redirector runs them against a
# free-licence image source at deploy time and serves whatever it gets from its
# own docroot, so no two redirectors carry the same picture and no visitor's
# browser ever reaches a third party. A term that finds nothing costs nothing:
# that slot falls back to the drawn SVG. See redstackpro/decoyassets.py.
#
# Two pools per vertical, because a page uses photographs two different ways.
# `scene` is the wide establishing shot behind the headline. `detail` is the
# closer, quieter image that sits beside body copy or on a service card. Using
# one pool for both puts a panorama on a 600px card and a close-up behind the
# hero text, and both read as filler.
#
# Terms are deliberately generic and describe no real place or organisation,
# which keeps the cover fictional (0041) and keeps the search from landing on a
# recognisable landmark that would date or locate the site.

redstackpro_decoy_imagery:
  cdn:
    scene: ["computer server room", "data centre server room", "fibre optic cables", "network operations centre"]
    detail: ["server rack", "network switch ports", "patch panel cabling", "data centre corridor"]
  maintenance:
    scene: ["empty office corridor", "industrial control room", "engineering workshop"]
    detail: ["control panel switches", "mechanical workshop", "maintenance schedule board"]
  webserver:
    scene: ["open plan office workspace", "server room", "desktop computer office"]
    detail: ["computer keyboard close up", "whiteboard diagram", "monitor with dashboard"]
  healthcare:
    scene: ["hospital corridor interior", "medical clinic waiting room", "hospital reception"]
    detail: ["stethoscope on desk", "medical consultation room", "laboratory glassware", "microscope laboratory"]
  finance:
    scene: ["glass office atrium", "modern office building interior", "office building lobby"]
    detail: ["modern office desk", "calculator and documents", "computer keyboard close up"]
  education:
    scene: ["university lecture theatre", "campus quadrangle", "school library interior"]
    detail: ["books on shelf", "school classroom interior", "classroom whiteboard", "student study area"]
  news:
    scene: ["television newsroom", "television studio", "newsroom desks"]
    detail: ["microphone studio", "notebook and pen writing", "typewriter desk"]
  ecommerce:
    scene: ["storage facility interior", "storage warehouse", "warehouse racking interior"]
    detail: ["cardboard boxes stacked", "storage racks boxes", "packing station", "barcode scanner"]
  food:
    scene: ["cafe interior", "restaurant dining room", "commercial kitchen"]
    detail: ["restaurant table setting", "plated meal", "fresh vegetables market", "bread bakery"]
  it:
    scene: ["computer laboratory", "open plan office", "server room"]
    detail: ["computer keyboard close up", "network cabling", "ethernet cables", "circuit board"]
  sports:
    scene: ["sports hall interior", "indoor swimming pool", "running track"]
    detail: ["gym equipment", "running shoes", "swimming pool lane"]
  travel:
    scene: ["railway station concourse", "coastal landscape", "mountain valley"]
    detail: ["map and compass", "travel luggage", "passport documents", "suitcase packing"]
