---
# redStackPRO SIEM. Clean-room MIT: installs the telemetry product the canvas
# chose on the standalone box (the Windows hosts get the matching agent from the
# agent step keyed on their edr). Reached over SSH as root. A range collects
# through this box, not the attack-side shipper. See goad-native-recreation.

- name: Install Wazuh
  ansible.builtin.include_tasks: wazuh.yml
  when: redstackpro_siem_product | default('') == 'wazuh'

- name: Install ELK
  ansible.builtin.include_tasks: elk.yml
  when: redstackpro_siem_product | default('') == 'elk'

- name: Report an unset or unsupported telemetry product
  ansible.builtin.debug:
    msg: >-
      SIEM product '{{ redstackpro_siem_product | default('unset') }}' has no
      installer; set it to wazuh or elk.
  when: redstackpro_siem_product | default('') not in ['wazuh', 'elk']
