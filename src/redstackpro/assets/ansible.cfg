# redStackPRO deploy defaults. Read from the export root, which is where the
# README tells you to run ansible-playbook from.
[defaults]
host_key_checking = False

# When a task escalates to an unprivileged account (become_user), Ansible has to
# hand that account the module's temp files. It prefers setfacl; where the target
# has no usable acl tooling it falls back to a chmod that, on ansible-core 2.19,
# emits BSD-style ACL syntax and dies with "chmod: invalid mode 'A+user:...'".
# That killed the kali operator's pipx setup, and because the operators play
# targets only that host, the whole run aborted before the later plays (the
# /etc/hosts mapping among them) could run. Allowing world-readable temp files is
# the documented fallback and is safe here: the range operator box is isolated
# and the files are the module args, briefly readable, not secrets at rest.
allow_world_readable_tmpfiles = True

# Global safety net: no single task may run longer than one hour. A task that
# wedges (for example an installer that never returns) then fails and can be
# recovered by re-running the idempotent playbook, instead of hanging the whole
# deploy with no output. Raise this only if a lab has a legitimately longer task.
task_timeout = 3600
